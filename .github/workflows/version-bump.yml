name: Version bump → Release + Package

# ─── What this does ──────────────────────────────────────────────────────────
# Bumping backend/VERSION on master is the single trigger for a release:
#   push commit that changes backend/VERSION
#     └─ this workflow dispatches Release (release.yml)
#          ├─ GitHub Release + tag v<version>
#          └─ Docker image pushed to GHCR  → ghcr.io/<owner>/sublarr package
# A version bump commit needs no other manual step.
#
# Pre-release versions (X.Y.Z-rc.N / -alpha / -beta) do NOT cut a release:
# release.yml skips RC tags on purpose. Those bump the RC build/push instead
# (docker-build.yml), which publishes :<version> and :rc-latest on GHCR.
#
# workflow_dispatch is used instead of pushing a tag from here: GitHub does not
# start workflows for refs created with GITHUB_TOKEN, so a tag push made by this
# job would never reach release.yml. Dispatching release.yml does run it, and
# release.yml creates the tag itself as part of `gh release create`.

on:
  push:
    branches: [master]
    paths: ['backend/VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release this version even if backend/VERSION was not changed by the triggering commit'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # HEAD~1 is needed to tell a real bump from a touch of the same value.
          fetch-depth: 2

      - name: Compare backend/VERSION with the previous commit
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          CURRENT=$(tr -d '[:space:]' < backend/VERSION)
          PREVIOUS=""

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            PREVIOUS=$(git show HEAD~1:backend/VERSION 2>/dev/null | tr -d '[:space:]' || true)
            if [[ -z "$PREVIOUS" || "$CURRENT" == "$PREVIOUS" ]]; then
              echo "ℹ️  backend/VERSION unchanged ($CURRENT) — nothing to release."
              exit 0
            fi
            VERSION="$CURRENT"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "❌  '$VERSION' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "detected: ${PREVIOUS:-<none>} -> $VERSION"

          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "ℹ️  Release v${VERSION} already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cut the release (GitHub Release + GHCR package)
        if: steps.compare.outputs.skip != 'true' && steps.compare.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            -f version="${{ steps.compare.outputs.version }}" \
            -f push_docker=true \
            -f create_release=true \
            -f skip_tests=false
          echo "🚀  Dispatched Release for v${{ steps.compare.outputs.version }}"

      - name: Build the release candidate package
        if: steps.compare.outputs.skip != 'true' && steps.compare.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run docker-build.yml -f version="${{ steps.compare.outputs.version }}"
          echo "🚀  Dispatched Docker build for ${{ steps.compare.outputs.version }}"
